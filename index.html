var mcDone=0, mcRight=0, fbRight=0, fbTotal=0, fbChecked=false;
FB.forEach(function(x){fbTotal+=x.a.length});

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function norm(s){return s.toLowerCase().replace(/[\s·.,。,、「」]/g,"")}

function updateScore(){
  var s="選擇題 <b>"+(mcRight*2)+"</b>/30";
  if(fbChecked)s+="　填充題 <b>"+fbRight+"</b>/"+fbTotal;
  document.getElementById("score").innerHTML=s;
}

function buildMC(){
  var box=document.getElementById("mc-list");box.textContent="";mcDone=0;mcRight=0;
  MC.forEach(function(item,qi){
    var fs=el("fieldset","q");fs.style.margin="0 0 .9rem";
    fs.appendChild(el("legend","",(qi+1)+". "+item.q));
    var opts=el("div","opts"),exp=el("p","exp");exp.hidden=true;
    var btns=[];
    item.o.forEach(function(text,oi){
      var b=el("button","opt");b.type="button";
      b.appendChild(el("b","","ABCD"[oi]));b.appendChild(el("span","",text));
      b.addEventListener("click",function(){
        btns.forEach(function(x){x.disabled=true});
        var ok=oi===item.a;
        btns[item.a].classList.add("right");
        if(!ok)b.classList.add("wrong");
        exp.hidden=false;exp.className="exp"+(ok?"":" no");
        exp.textContent="";
        exp.appendChild(el("b","",ok?"答對了。":"答案是 "+"ABCD"[item.a]+"。"));
        exp.appendChild(document.createTextNode(item.e));
        mcDone++;if(ok)mcRight++;updateScore();
      });
      btns.push(b);opts.appendChild(b);
    });
    fs.appendChild(opts);fs.appendChild(exp);box.appendChild(fs);
  });
  updateScore();
}

function buildFB(){
  var box=document.getElementById("fb-list");box.textContent="";
  fbChecked=false;fbRight=0;document.getElementById("fb-result").textContent="";
  FB.forEach(function(item,i){
    var d=el("div","q fb");
    d.appendChild(document.createTextNode((i+1)+". "));
    item.t.split("{}").forEach(function(part,k,arr){
      d.appendChild(document.createTextNode(part));
      if(k<arr.length-1){
        var inp=el("input");inp.type="text";inp.id="fb"+i+"_"+k;
        inp.setAttribute("aria-label","第 "+(i+1)+" 題空格 "+(k+1));
        inp.autocomplete="off";d.appendChild(inp);
      }
    });
    box.appendChild(d);
  });
  updateScore();
}

function checkFB(){
  fbRight=0;
  FB.forEach(function(item,i){
    item.a.forEach(function(acc,k){
      var inp=document.getElementById("fb"+i+"_"+k);
      var old=inp.parentNode.querySelectorAll(".ans[data-k='"+k+"']");
      old.forEach(function(n){n.remove()});
      var ok=acc.some(function(x){return norm(x)===norm(inp.value)});
      inp.className=ok?"ok":"bad";
      if(ok)fbRight++;
      else{var s=el("span","ans","答案:"+acc[0]);s.dataset.k=k;inp.after(s)}
    });
  });
  fbChecked=true;
  document.getElementById("fb-result").textContent="答對 "+fbRight+" / "+fbTotal+" 個空格";
  updateScore();
}

function buildQA(boxId,list){
  var box=document.getElementById(boxId);
  list.forEach(function(item,i){
    var d=el("div","q");
    var qt=el("div","qtext",(i+1)+". "+item.q);
    qt.appendChild(el("span","mk",item.m+" 分"));
    d.appendChild(qt);
    if(item.intro)d.appendChild(el("p","",item.intro));
    if(item.tbl){
      var w=el("div","tw"),t=el("table");if(item.left)t.className="left";
      item.tbl.forEach(function(r,ri){
        var tr=el("tr");
        r.forEach(function(c){tr.appendChild(el(ri===0||tr.children.length===0?"th":"td","",c))});
        t.appendChild(tr);
      });
      w.appendChild(t);d.appendChild(w);
      if(item.sub)d.appendChild(el("p","qtext",item.sub));
    }
    (item.parts||[]).forEach(function(x){d.appendChild(el("p","part",x))});
    var det=el("details");det.appendChild(el("summary","","參考答案及給分點"));
    var ul=el("ul");item.p.forEach(function(x){ul.appendChild(el("li","",x))});
    det.appendChild(ul);d.appendChild(det);box.appendChild(d);
  });
}

document.getElementById("mc-reset").addEventListener("click",buildMC);
document.getElementById("fb-reset").addEventListener("click",buildFB);
document.getElementById("fb-check").addEventListener("click",checkFB);
buildMC();buildFB();buildQA("qa-list",QA);buildQA("an-list",AN);
</script>
